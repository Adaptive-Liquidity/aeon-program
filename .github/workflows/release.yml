# AEON — formal GitHub Release on version tags
# Tag v0.2.0+ → creates a Release whose body comes from docs/RELEASE_NOTES_<ver>.md
# (falls back to the tag annotation when no notes file exists).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release notes
        id: notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          file="docs/RELEASE_NOTES_${ver}.md"
          if [ -f "$file" ]; then
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(release create "$GITHUB_REF_NAME" --verify-tag --title "AEON $GITHUB_REF_NAME")
          if [ -n "${{ steps.notes.outputs.body_path }}" ]; then
            args+=(--notes-file "${{ steps.notes.outputs.body_path }}")
          fi
          gh release create "${args[@]}"
