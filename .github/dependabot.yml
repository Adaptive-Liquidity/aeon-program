# AEON — dependency automation
# npm: repo had 20 open advisories (5 high) with no update automation.
# github-actions: keep workflow actions current. cargo: conservative monthly.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Pinned: TS SDK targets Anchor 0.30.1 (on-chain build + IDL). Anchor
    # minor/major bumps need a dedicated upgrade PR, never a routine bump.
    # TypeScript majors need a dedicated toolchain upgrade PR (post-v0.2 tag).
    ignore:
      - dependency-name: "@coral-xyz/anchor"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Pinned: on-chain program builds against anchor-lang 0.30.1.
    # Minor/major bumps need a dedicated upgrade PR with SBF rebuild + full e2e.
    ignore:
      - dependency-name: "anchor-lang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
